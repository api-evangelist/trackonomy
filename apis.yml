name: Trackonomy
description: Trackonomy is a supply chain visibility company that digitizes real-world operations
  with barely-there smart label sensors. Its SmartTape and THL Tape products provide item-level
  tracking, monitoring location, temperature, humidity, and light in real time, while its platform
  connects, automates, controls, and remediates operations processes at global scale for logistics,
  industrial, utilities, healthcare, government, and airline customers. Trackonomy is backed by 8VC.
  It advertises a customizable RESTful API and webhook-based real-time data exchange for platform
  customers, but publishes no public developer portal, API documentation, or SDKs.
